apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      restartPolicy: Always
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
          imagePullPolicy: Always
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "http://jellyfin.admin.thelegend27.fr"
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-series
              mountPath: /series
            - name: jellyfin-movies
              mountPath: /movies
            - name: jellyfin-pictures
              mountPath: /pictures
          ports:
            - containerPort: 8096
      volumes:
        - name: jellyfin-config
          hostPath:
            path: /home/thelegend27/homeserver/kubernetes/jellyfin/config
        - name: jellyfin-movies
          hostPath:
            path: /mnt/media/movies
        - name: jellyfin-pictures
          hostPath:
            path: /mnt/media/pictures
        - name: jellyfin-series
          hostPath:
            path: /mnt/media/series
