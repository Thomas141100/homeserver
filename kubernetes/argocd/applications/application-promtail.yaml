apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/Thomas141100/homeserver.git'
      path: kubernetes/promtail
      targetRevision: main
      ref: values
    - chart: promtail
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 6.17.1
      helm:
        valueFiles:
          - $values/kubernetes/promtail/values.yaml
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
