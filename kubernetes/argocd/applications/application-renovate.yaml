apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/Thomas141100/homeserver.git'
      path: kubernetes/renovate
      targetRevision: main
      ref: values
    - repoURL: oci://ghcr.io/renovatebot/charts/renovate
      path: .
      targetRevision: 46.414.0
      helm:
        valueFiles:
          - $values/kubernetes/renovate/values.yaml
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
