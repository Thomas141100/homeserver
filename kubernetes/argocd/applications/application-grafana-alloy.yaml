apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/Thomas141100/homeserver.git'
      path: kubernetes/grafana-alloy
      targetRevision: main
      ref: values
    - repoURL: oci://ghcr.io/grafana-community/helm-charts/alloy
      path: .
      targetRevision: 1.20.1
      helm:
        valueFiles:
          - $values/kubernetes/grafana-alloy/values.yaml
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
