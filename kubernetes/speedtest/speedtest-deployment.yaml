apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest
  namespace: speedtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedtest
  template:
    metadata:
      labels:
        app: speedtest
    spec:
      restartPolicy: Always
      containers:
        - name: speedtest
          image: germannewsmaker/myspeed:latest@sha256:3a3e774b3f78d930a5a962d625b99bcb3d71730bfeb4a6b93e04fd38cfe7d9a9
          imagePullPolicy: Always
          volumeMounts:
            - name: speedtest-data
              mountPath: /myspeed/data
          ports:
            - containerPort: 5216
      volumes:
        - name: speedtest-data
          hostPath:
            path: /home/thelegend27/homeserver/speedtest/data
