apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: movies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      restartPolicy: Always
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: radarr-media
              mountPath: /media
          ports:
            - containerPort: 7878
      volumes:
        - name: radarr-config
          hostPath:
            path: /home/thelegend27/homeserver/movies/radarr/config
        - name: radarr-media
          hostPath:
            path: /mnt/media
