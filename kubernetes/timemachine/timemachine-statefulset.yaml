---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timemachine
  namespace: timemachine
spec:
  serviceName: timemachine
  replicas: 1
  selector:
    matchLabels:
      app: timemachine
  template:
    metadata:
      labels:
        app: timemachine
    spec:
      hostNetwork: true
      containers:
        - name: timemachine
          image: mbentley/timemachine:smb@sha256:587ba12f70fe0d80c3f12dd96a7dd1ae5d45473adad341e4dd10d3966ededc3c
          imagePullPolicy: Always
          ports:
            - containerPort: 137
              name: udp137
              protocol: UDP
            - containerPort: 138
              name: udp138
              protocol: UDP
            - containerPort: 139
              name: tcp139
            - containerPort: 445
              name: tcp445
          volumeMounts:
            - name: timemachine-data
              mountPath: /opt/timemachine
            - name: run-samba
              mountPath: /run/samba
          envFrom:
            - configMapRef:
                name: timemachine-config
      volumes:
        - name: timemachine-data
          hostPath:
            path: /mnt/timemachine
        - name: run-samba
          emptyDir: {}
