apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: movies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      restartPolicy: Always
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: sonarr-media
              mountPath: /media
          ports:
            - containerPort: 8989
      volumes:
        - name: sonarr-config
          hostPath:
            path: /home/thelegend27/homeserver/movies/sonarr/config
        - name: sonarr-media
          hostPath:
            path: /mnt/media
