apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: movies
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      restartPolicy: Always
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
          # image: ghcr.io/almottier/prowlarr-ygg
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
          ports:
            - containerPort: 9696
      volumes:
        - name: prowlarr-config
          hostPath:
            path: /home/thelegend27/homeserver/movies/prowlarr/config
