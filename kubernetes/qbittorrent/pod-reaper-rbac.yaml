---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reaper-sa
  namespace: qbittorrent
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pod-reaper-role
  namespace: qbittorrent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reaper-role-binding
  namespace: qbittorrent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reaper-role
subjects:
  - name: pod-reaper-sa
    kind: ServiceAccount
    namespace: qbittorrent
